    <div class="topnav-links">
    <a class="nav-item active" href="admin-dashboard.html">📊 Dashboard</a>
    <a class="nav-item" href="admin-users.html">👥 Tài khoản</a>

  <div class="topnav-actions">

  </div>
  <div class="topnav-mobile">
    <a class="nav-item active" href="admin-dashboard.html">📊 Dashboard</a>
    <a class="nav-item" href="admin-users.html">👥 Tài khoản</a>
    <a class="nav-item" href="admin-courses.html">📚 Môn học</a>
    <a class="nav-item" href="admin-questions.html">🗂️ Ngân hàng câu hỏi</a>

  </div>
</nav>
  <main class="main-content">
    <div class="topbar">
      <div>
        <button class="btn btn-secondary hamburger-btn" onclick="toggleSidebar()">☰</button>
        <h1>Admin Dashboard</h1>
        <div class="sub">Tổng quan hệ thống EduAI</div>
      </div>
    </div>
    <div class="grid grid-4" id="statCards"></div>
  </main>
</div>
<script src="../js/api.js"></script>
<script>
requireAuth();
async function load() {
  const stats = await Api.request("/api/admin/dashboard");
  const items = [
    ["👤", "Tổng sinh viên", stats.total_students, "#eff6ff"],
    ["📚", "Tổng môn học", stats.total_courses, "#f0fdf4"],
    ["📖", "Tổng chương", stats.total_chapters, "#fffbeb"],
    ["📄", "Tổng tài liệu", stats.total_documents, "#eef2ff"],
    ["❓", "Tổng câu hỏi", stats.total_questions, "#fdf4ff"],
    ["💬", "Tổng lượt hỏi AI", stats.total_ai_queries, "#f0f9ff"],
  ];
  document.getElementById("statCards").innerHTML = items.map(([icon, label, value, bg]) => `
    <div class="card stat-card">
      <div class="icon" style="background:${bg};">${icon}</div>
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>`).join("");
}
load();
</script>
</body>
</html>
