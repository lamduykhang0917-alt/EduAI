<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Môn học — EduAI</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* Course cards */
  .course-card {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    border-radius: var(--radius-card);
    border: 1px solid rgba(228,220,255,0.7);
    background: var(--bg-white);
    box-shadow: var(--shadow-card);
    transition: all var(--transition-base);
  }
  .course-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-elevated);
  }

  .course-header {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
  }
  .course-header::after {
    content: '';
    position: absolute;
    right: -20px; bottom: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }
  .course-header-icon {
    font-size: 28px;
    z-index: 1;
  }
  .course-header .prog-badge {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    z-index: 1;
  }

  .course-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .course-code { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .course-name { font-size: 16px; font-weight: 700; color: var(--text-primary); margin: 0; line-height: 1.3; letter-spacing: -0.2px; }
  .course-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; min-height: 38px; }

  .course-progress { display: flex; flex-direction: column; gap: 6px; }
  .course-progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 600; }

  .course-meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); }
  .course-meta span { display: flex; align-items: center; gap: 4px; }

  .course-footer { padding: 14px 20px; border-top: 1px solid var(--border-subtle); }

  /* Gradient themes for course headers */
  .grad-1 { background: linear-gradient(135deg, #1d4ed8, #2563eb); }
  .grad-2 { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
  .grad-3 { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
  .grad-4 { background: linear-gradient(135deg, #059669, #10b981); }
  .grad-5 { background: linear-gradient(135deg, #f59e0b, #f97316); }
  .grad-6 { background: linear-gradient(135deg, #f43f5e, #e11d48); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-logo" href="dashboard.html"><span class="mark">E</span>EduAI</a>
    <div class="topnav-links">
    <a class="nav-item" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-item active" href="courses.html">📚 Môn học</a>
    <a class="nav-item" href="documents.html">📄 Tài liệu</a>
    <a class="nav-item" href="chatbot.html">💬 Hỏi AI</a>
    <a class="nav-item" href="quiz-list.html">📝 Ôn tập &amp; Kiểm tra</a>
    <a class="nav-item" href="progress.html">📈 Tiến độ học tập</a>
    </div>
  <div class="topnav-actions">
    <a class="nav-item" href="#" onclick="logout(); return false;">🚪 Đăng xuất</a>
  </div>
  </div>
  <div class="topnav-mobile">
    <a class="nav-item" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-item active" href="courses.html">📚 Môn học</a>
    <a class="nav-item" href="documents.html">📄 Tài liệu</a>
    <a class="nav-item" href="chatbot.html">💬 Hỏi AI</a>
    <a class="nav-item" href="quiz-list.html">📝 Ôn tập &amp; Kiểm tra</a>
    <a class="nav-item" href="progress.html">📈 Tiến độ học tập</a>
    <a class="nav-item" href="#" onclick="logout(); return false;">🚪 Đăng xuất</a>
  </div>
</nav>

  <main class="main-content">
    <div class="topbar animate-fade-in">
      <div>
        <button class="btn btn-secondary hamburger-btn" onclick="toggleSidebar()">☰</button>
        <h1>Môn học 📚</h1>
        <div class="sub">Danh sách các môn học của bạn</div>
      </div>
    </div>

    <div class="grid grid-3" id="courseGrid" style="align-items:start;"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
requireAuth();

const gradients = ['grad-1','grad-2','grad-3','grad-4','grad-5','grad-6'];
const icons     = ['🧮','🤖','💻','🧬','📐','🔬','📊','⚙️','🌐','🎯'];

async function load() {
  try {
    const courses = await Api.courses();
    const grid = document.getElementById("courseGrid");
    if (!courses.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📚</div>
          <p>Chưa có môn học nào. Vui lòng liên hệ giảng viên.</p>
        </div>`;
      return;
    }
    grid.innerHTML = courses.map((c, i) => `
      <div class="course-card animate-fade-in-up" style="animation-delay:${i * 0.07}s;">
        <div class="course-header ${gradients[i % gradients.length]}">
          <span class="course-header-icon">${icons[i % icons.length]}</span>
          <span class="prog-badge">${Math.round(c.progress)}%</span>
        </div>
        <div class="course-body">
          <div class="course-code">${c.code}</div>
          <div class="course-name">${c.name}</div>
          <div class="course-desc">${c.description || 'Khám phá nội dung môn học và học cùng AI.'}</div>
          <div class="course-progress">
            <div class="course-progress-label">
              <span>Tiến độ</span>
              <span>${Math.round(c.progress)}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${c.progress}%;"></div></div>
          </div>
          <div class="course-meta">
            <span>📖 ${c.chapter_count} chương</span>
            <span>📄 ${c.document_count} tài liệu</span>
          </div>
        </div>
        <div class="course-footer">
          <a class="btn btn-primary" href="course-detail.html?id=${c.id}" style="width:100%;justify-content:center;">
            Vào học →
          </a>
        </div>
      </div>`).join('');
  } catch (err) { console.error(err); }
}
load();
</script>
</body>
</html>
